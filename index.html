<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sudoku</title>
<style>
  body { font-family: sans-serif; text-align: center; margin-top: 20px; }
  #grid {
    display: grid;
    grid-template-columns: repeat(9, 44px);
    width: max-content;
    margin: 20px auto;
    border: 3px solid #000;
  }
  .cell {
    width: 44px; height: 44px;
    box-sizing: border-box;
    border: 1px solid #bbb;
    text-align: center;
    font-size: 20px;
    padding: 0;
  }
  .cell.given { background: #eee; font-weight: bold; }
  .cell.salah { background: #ffc9c9; }
  .cell:nth-child(9n+3), .cell:nth-child(9n+6) { border-right: 2px solid #000; }
  .cell:nth-child(n+19):nth-child(-n+27),
  .cell:nth-child(n+46):nth-child(-n+54) { border-bottom: 2px solid #000; }
  button { padding: 8px 16px; font-size: 16px; margin: 4px; }
  #pesan { font-size: 18px; height: 24px; }
</style>
</head>
<body>
  <h1>Sudoku</h1>
  <div id="grid"></div>
  <div id="pesan"></div>
  <button onclick="cekJawaban()">Cek Jawaban</button>
  <button onclick="gameBaru()">Game Baru</button>

<script>
let solusi = [];
let puzzle = [];

// ---------- FUNGSI BIKIN PUZZLE ----------

// acak urutan array
function acak(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// cek apakah angka n boleh ditaruh di baris r, kolom c
function aman(b, r, c, n) {
  for (let i = 0; i < 9; i++) {
    if (b[r][i] === n || b[i][c] === n) return false;
  }
  const br = r - (r % 3), bc = c - (c % 3);
  for (let i = 0; i < 3; i++)
    for (let j = 0; j < 3; j++)
      if (b[br + i][bc + j] === n) return false;
  return true;
}

// isi papan penuh pakai backtracking
function isiPapan(b) {
  for (let r = 0; r < 9; r++) {
    for (let c = 0; c < 9; c++) {
      if (b[r][c] === 0) {
        for (const n of acak([1,2,3,4,5,6,7,8,9])) {
          if (aman(b, r, c, n)) {
            b[r][c] = n;
            if (isiPapan(b)) return true;
            b[r][c] = 0;
          }
        }
        return false;
      }
    }
  }
  return true;
}

// bikin puzzle: papan penuh, lalu hapus beberapa kotak
function buatPuzzle(jumlahKosong = 40) {
  solusi = Array.from({ length: 9 }, () => Array(9).fill(0));
  isiPapan(solusi);
  puzzle = solusi.map(baris => [...baris]);
  let hapus = 0;
  while (hapus < jumlahKosong) {
    const r = Math.floor(Math.random() * 9);
    const c = Math.floor(Math.random() * 9);
    if (puzzle[r][c] !== 0) {
      puzzle[r][c] = 0;
      hapus++;
    }
  }
}

// ---------- TAMPILAN ----------

function tampilkan() {
  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  for (let r = 0; r < 9; r++) {
    for (let c = 0; c < 9; c++) {
      const input = document.createElement("input");
      input.className = "cell";
      input.maxLength = 1;
      input.dataset.r = r;
      input.dataset.c = c;
      if (puzzle[r][c] !== 0) {
        input.value = puzzle[r][c];
        input.readOnly = true;
        input.classList.add("given");
      } else {
        // hanya boleh angka 1-9
        input.addEventListener("input", () => {
          input.value = input.value.replace(/[^1-9]/g, "");
          input.classList.remove("salah");
        });
      }
      grid.appendChild(input);
    }
  }
}

// ---------- CEK JAWABAN ----------

function cekJawaban() {
  const semua = document.querySelectorAll(".cell");
  let salah = 0, kosong = 0;
  semua.forEach(el => {
    el.classList.remove("salah");
    if (el.readOnly) return;
    const r = el.dataset.r, c = el.dataset.c;
    if (el.value === "") {
      kosong++;
    } else if (Number(el.value) !== solusi[r][c]) {
      el.classList.add("salah");
      salah++;
    }
  });
  const pesan = document.getElementById("pesan");
  if (salah > 0) pesan.textContent = "Ada " + salah + " kotak yang salah (warna merah).";
  else if (kosong > 0) pesan.textContent = "Yang terisi sudah benar, tapi masih ada " + kosong + " kotak kosong.";
  else pesan.textContent = "Selamat, semua benar! 🎉";
}

function gameBaru() {
  document.getElementById("pesan").textContent = "";
  buatPuzzle(40);
  tampilkan();
}

gameBaru();
</script>
</body>
</html>
